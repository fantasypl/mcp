name: Release

# Builds both binaries for each target platform and attaches them to the
# GitHub Release, replacing the reference workflow's PyPI publish step —
# this project ships as a binary, not a package registry artifact.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/fpl-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/fpl-mcp
          go build -ldflags="-s -w" \
            -o "dist/fplctl-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/fplctl

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
